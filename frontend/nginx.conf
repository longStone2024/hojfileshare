server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    expires -1;

    client_max_body_size 200m;

    # 老下载链接兼容：/s/abc/download 自动转到 /api/share/abc/download
    location ~ ^/s/([a-z0-9]+)/download$ {
        return 302 /api/share/$1/download$is_args$args;
    }

    # 分享短链：返回独立页面，前端 JS 通过 /api/share/* 拉数据
    location /s/ {
        try_files $uri /share.html;
    }

    # 独立管理页
    location /admin {
        try_files $uri $uri/ /admin.html;
    }

    # 公告页
    location /notice {
        try_files $uri $uri/ /notice.html;
    }

    # WebDAV
    location ^~ /dav {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 200m;
    }

    # API
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
}